<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>大秘寶挖掘中｜任期大冒險</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
:root{--ink:#202247;--blue:#263c75;--cream:#fff1c9;--gold:#ffd75c;--red:#cf4546;--teal:#69d4c7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 20%,#375a92,#151d43 80%);color:#fff;font-family:'Noto Sans TC',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:18px}
.cabinet{width:min(1100px,100%);background:linear-gradient(145deg,#fff0b9,#d7a85c);padding:14px;border:5px solid #f8d77d;border-radius:22px;box-shadow:0 18px 0 #573c39,0 28px 60px #0009;position:relative}
.marquee{height:56px;background:linear-gradient(#273b78,#141d48);border:3px solid #523b67;border-radius:12px 12px 6px 6px;display:flex;align-items:center;justify-content:center;color:#ffe36b;font-weight:900;font-size:clamp(19px,3vw,29px);letter-spacing:.1em;text-shadow:2px 3px #8e4138;margin-bottom:9px}
.screen{position:relative;aspect-ratio:4/3;width:100%;overflow:hidden;border:7px solid #293760;border-radius:8px;background:#7db7d2;box-shadow:inset 0 0 0 3px #ffffff8c}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;cursor:crosshair}
.help{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#452c3d;font-size:12px;font-weight:700;padding:8px 3px 1px}.actions{display:flex;align-items:center;gap:8px}.pill{background:#fff3ca;border:2px solid #9a6b53;border-radius:30px;padding:5px 11px}.button{border:0;border-radius:8px;color:#331f3b;background:linear-gradient(#ffe875,#e39e32);box-shadow:0 4px 0 #895b3a;padding:8px 17px;font-weight:900;font-size:15px;cursor:pointer}.button:hover{filter:brightness(1.08);transform:translateY(-1px)}.button:active{transform:translateY(2px);box-shadow:0 2px #895b3a}.overlay{position:absolute;inset:0;background:#101536a8;display:flex;align-items:center;justify-content:center;padding:18px;z-index:3}.card{width:min(590px,95%);max-height:95%;overflow:auto;color:#302744;background:linear-gradient(145deg,#fff8dc,#f5daa0);border:5px solid #bf8c4e;border-radius:15px;padding:18px 20px;box-shadow:0 8px 0 #5e3b49;text-align:center}.card h2{margin:0 0 8px;font-size:clamp(22px,3vw,32px);color:#923f46}.card p{font-weight:700;line-height:1.55;margin:8px 0}.card .quote{font-size:clamp(17px,2.6vw,24px);background:#fff;border:2px dashed #d27d53;padding:12px;border-radius:9px}.choices{display:grid;gap:8px;margin-top:12px}.choices .button{white-space:normal;text-align:left;line-height:1.35;background:linear-gradient(#fff5c9,#f4d179);padding:10px 12px}.hidden{display:none!important}.small{font-size:11px;color:#623f50}
.test-tools{display:flex;align-items:center;gap:6px}.test-tools select{max-width:135px;padding:7px;border-radius:8px;border:2px solid #9a6b53;background:#fff3ca;color:#35273b;font-weight:700}.orange-board{display:block;width:min(100%,360px);max-height:48vh;object-fit:contain;margin:10px auto 8px;border:4px solid #c95b39;border-radius:7px;box-shadow:0 5px 0 #8c4e43}@media(max-width:620px){body{padding:6px}.cabinet{padding:7px;border-width:3px}.marquee{height:42px;margin-bottom:5px}.help{font-size:10px;flex-wrap:wrap}.button{font-size:13px;padding:7px 12px}.pill{padding:4px 7px}.test-tools{width:100%;justify-content:center}.test-tools select{max-width:120px}.orange-board{max-height:42vh}}
</style>
</head>
<body><main class="cabinet"><header class="marquee">★ 大秘寶挖掘中 ★ 任期大冒險</header><section class="screen"><canvas id="game" width="960" height="720" aria-label="大秘寶挖掘遊戲畫面"></canvas><div id="overlay" class="overlay"><div class="card" id="card"></div></div></section><footer class="help"><div class="actions"><span class="pill" id="status">準備開始</span><span class="pill" id="score">施政成果 0 分</span></div><div class="actions"><span class="pill">點地面前進，到點自動挖掘</span><button id="dig" class="button">⛏ 開挖！</button><div class="test-tools"><select id="test-treasure" aria-label="測試指定寶物"><option value="poster">莊 OO 文宣</option><option value="truck">宣傳車</option><option value="rice">米粉</option><option value="bottle">2026 寶特瓶</option><option value="ball">棒球</option><option value="summons">傳票</option></select><button id="test-dig" class="button" type="button">測試出土</button></div></div></footer></main>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),card=document.querySelector('#card'),statusEl=document.querySelector('#status'),scoreEl=document.querySelector('#score'),digBtn=document.querySelector('#dig'),testBtn=document.querySelector('#test-dig'),testSelect=document.querySelector('#test-treasure');
const posterImage=new Image();posterImage.src='assets/zhuang-poster-reference.jpg';
const W=960,H=720;let mode='intro',player={x:460,y:430,tx:460,ty:430,step:0,faceX:1,faceY:0,aimX:1,aimY:0},items=[],pits=[],score=0,counts={rice:0,bottle:0,ball:0,truck:0,poster:0,summons:0},summons=0,timeLeft=60,last=0,lockUntil=0,previewUntil=0,police=false,dug=0,gridPos=0,trail=[],roadSet=new Set(),question=null,timedModal=false,digging=false,digEndsAt=0,autoDig=false,pendingTreasure=null;
const colors={grass:'#7ca95b',grass2:'#6f9a53',hill:'#99bd69',deep:'#527747',road:'#c89c60',roadEdge:'#8b644b',purple:'#b27ac8'};
const labels={rice:'米粉',bottle:'2026 寶特瓶',ball:'棒球',truck:'何 OO 宣傳車',poster:'莊 OO 文宣',summons:'傳票'};
function rnd(a,b){return a+Math.random()*(b-a)}
function setStatus(t){statusEl.textContent=t}
function updateHUD(){scoreEl.textContent=`施政成果 ${score} 分`}
function cardHtml(title,body,buttons=[],small=''){card.innerHTML=`<h2>${title}</h2>${body}${buttons.length?`<div class="choices">${buttons.map((b,i)=>`<button class="button" data-i="${i}">${b.label}</button>`).join('')}</div>`:''}${small?`<p class="small">${small}</p>`:''}`;overlay.classList.remove('hidden');card.querySelectorAll('button').forEach(b=>b.onclick=()=>buttons[+b.dataset.i].action())}
function hideCard(){overlay.classList.add('hidden')}
function start(){mode='dig';timeLeft=60;score=0;dug=0;summons=0;police=false;digging=false;autoDig=false;pendingTreasure=null;pits=[];counts={rice:0,bottle:0,ball:0,truck:0,poster:0,summons:0};player={x:460,y:440,tx:460,ty:440,step:0,faceX:1,faceY:0,aimX:1,aimY:0};items=[];
 const types=['summons','summons','summons','rice','rice','rice','bottle','bottle','bottle','ball','ball','ball','ball','truck','truck','poster','poster'];
 types.forEach((type,i)=>{let x,y,tries=0;do{x=rnd(65,895);y=rnd(220,640);tries++}while(Math.hypot(x-460,y-440)<95&&tries<40);items.push({type,x,y,found:false})});
 previewUntil=performance.now()+2600;setStatus('任期 60 秒');updateHUD();cardHtml('第一關｜任期挖掘','<p>在這片連續地形裡點擊移動，再按「開挖！」尋找施政成果。寶藏只會在挖掘附近出土。</p><p>撐過 60 秒任期，避開第三張傳票，就能挑戰連任。</p>',[{label:'開始任期',action:()=>hideCard()}],'政治諷刺遊戲；角色與台詞為遊戲文本，不代表新聞引述或事實判定。')}
function drawText(text,x,y,size=18,color='#fff',align='left'){ctx.font=`900 ${size}px 'Noto Sans TC',system-ui`;ctx.textAlign=align;ctx.lineWidth=4;ctx.strokeStyle='#263454';ctx.strokeText(text,x,y);ctx.fillStyle=color;ctx.fillText(text,x,y)}
function drawWorld(){let g=ctx.createLinearGradient(0,100,0,720);g.addColorStop(0,'#a3d2de');g.addColorStop(.18,'#94bd72');g.addColorStop(1,'#547b50');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // rolling, open ground, no tile grid
 for(let i=0;i<18;i++){let x=(i*113+34)%1050-45,y=160+(i*71)%560;ctx.fillStyle=i%2?'#ffffff12':'#304c3922';ctx.beginPath();ctx.ellipse(x,y,80+(i%4)*12,18+(i%3)*8,-.08,0,Math.PI*2);ctx.fill()}
 // distant hills and civic skyline
 ctx.fillStyle='#547b79';ctx.beginPath();ctx.moveTo(0,179);ctx.quadraticCurveTo(180,110,355,182);ctx.quadraticCurveTo(540,105,720,177);ctx.quadraticCurveTo(840,125,960,172);ctx.lineTo(960,223);ctx.lineTo(0,223);ctx.fill();
 ctx.fillStyle='#e9d6aa';ctx.fillRect(82,139,113,61);ctx.fillStyle='#a9664c';ctx.beginPath();ctx.moveTo(68,141);ctx.lineTo(139,105);ctx.lineTo(211,141);ctx.fill();ctx.fillStyle='#89a9b2';ctx.fillRect(104,157,27,43);ctx.fillRect(148,157,27,43);drawText('市政服務站',140,220,13,'#fff','center');
 // decorative shrubs / flowers
 for(let i=0;i<26;i++){let x=(i*179+49)%940+10,y=(i*97+242)%440+250;if(Math.hypot(x-player.x,y-player.y)<50)continue;ctx.fillStyle='#315c48';ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.arc(x+8,y-4,7,0,7);ctx.fill();ctx.fillStyle=i%3?'#ffdd87':'#ffb3af';ctx.fillRect(x+5,y-14,3,3)}
 // reveal objects briefly at start and hints on digs
 for(const pit of pits){ctx.fillStyle='#3c4b3c55';ctx.beginPath();ctx.ellipse(pit.x,pit.y+6,25,10,0,0,7);ctx.fill();ctx.strokeStyle='#b78c58';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(pit.x,pit.y+2,22,9,0,0,7);ctx.stroke();ctx.fillStyle='#392f2e';ctx.beginPath();ctx.ellipse(pit.x,pit.y+2,17,6,0,0,7);ctx.fill();ctx.fillStyle='#c5a16b';ctx.beginPath();ctx.ellipse(pit.x-19,pit.y+4,4,2,-.25,0,7);ctx.ellipse(pit.x+17,pit.y+6,5,2,.2,0,7);ctx.fill()}
 for(const it of items){if(it.emerging){const p=Math.max(0,Math.min(1,(performance.now()-it.emergeStart)/1050)),lift=70*(1-Math.pow(1-p,3)),ex=it.emergeX,ey=it.emergeY;ctx.fillStyle='#7c654555';ctx.beginPath();ctx.ellipse(ex,ey+5,21,8,0,0,7);ctx.fill();ctx.fillStyle='#b98e5a';ctx.beginPath();ctx.ellipse(ex,ey+4,18,6,0,Math.PI,Math.PI*2);ctx.fill();drawTreasure(it.type,ex,ey-lift,1);ctx.font="900 16px 'Noto Sans TC',system-ui";const label=labels[it.type],lw=ctx.measureText(label).width+18,labelX=player.x,labelY=player.y-83-lift*.12;ctx.fillStyle='#fff1c9';ctx.strokeStyle='#80514a';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(labelX-lw/2,labelY-18,lw,25,7);ctx.fill();ctx.stroke();drawText(label,labelX,labelY,14,'#923f46','center');continue}if(it.found)continue;if(performance.now()<previewUntil){drawTreasure(it.type,it.x,it.y,1)}else if(it.hint){drawTreasure(it.type,it.x,it.y,.55)}}
 drawWoman(player.x,player.y,performance.now()/180);if(police){drawPolice()}
 drawHUD();if(mode==='dig'){drawText('點擊地面前進，抵達後自動揮鏟挖掘',480,690,15,'#fff','center')}
}
function drawTreasure(type,x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#29323b66';ctx.beginPath();ctx.ellipse(0,4,19,8,0,0,7);ctx.fill();if(type==='ball'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-6,12,0,7);ctx.fill();ctx.strokeStyle='#d95752';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-4,-7,7,-.9,.8);ctx.stroke();ctx.beginPath();ctx.arc(4,-6,7,2.4,4.2);ctx.stroke()}else if(type==='bottle'){ctx.fillStyle='#4fc3bd';ctx.fillRect(-7,-18,14,29);ctx.fillStyle='#9df5db';ctx.fillRect(-4,-23,8,6);ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.fillText('2026',-12,0)}else if(type==='rice'){ctx.fillStyle='#f8f1d5';ctx.beginPath();ctx.ellipse(0,-2,19,10,0,0,7);ctx.fill();ctx.strokeStyle='#bd8558';ctx.lineWidth=2;for(let i=-9;i<11;i+=5){ctx.beginPath();ctx.moveTo(i,-8);ctx.quadraticCurveTo(i+9,-1,i-2,5);ctx.stroke()}}else if(type==='truck'){ctx.fillStyle='#e87950';ctx.fillRect(-19,-17,27,16);ctx.fillStyle='#f6d070';ctx.fillRect(7,-12,12,11);ctx.fillStyle='#263454';ctx.beginPath();ctx.arc(-10,1,5,0,7);ctx.arc(12,1,5,0,7);ctx.fill()}else if(type==='poster'){if(posterImage.complete&&posterImage.naturalWidth){ctx.drawImage(posterImage,-17,-27,34,42)}else{ctx.fillStyle='#ef8548';ctx.fillRect(-15,-25,30,35);ctx.strokeStyle='#b64d36';ctx.lineWidth=2;ctx.strokeRect(-15,-25,30,35)}}else{ctx.fillStyle='#f7e8d1';ctx.fillRect(-15,-20,30,25);ctx.strokeStyle='#b74045';ctx.lineWidth=2;ctx.strokeRect(-15,-20,30,25);ctx.fillStyle='#b74045';ctx.font='bold 10px sans-serif';ctx.fillText('傳票',-10,-5)}ctx.restore()}
function drawWoman(x,y,t){ctx.save();ctx.translate(x,y);let bob=digging?0:Math.sin(t)*1.5;ctx.fillStyle='#34405b55';ctx.beginPath();ctx.ellipse(0,4,23,9,0,0,7);ctx.fill(); // ponytail
 ctx.fillStyle='#49324d';ctx.beginPath();ctx.moveTo(13,-43);ctx.quadraticCurveTo(41,-40,39,-14);ctx.quadraticCurveTo(37,5,27,-3);ctx.quadraticCurveTo(30,-20,13,-25);ctx.fill();ctx.beginPath();ctx.ellipse(31,-14,8,17,.4,0,7);ctx.fill();
 // body
 ctx.fillStyle='#7d65a8';ctx.beginPath();ctx.roundRect(-15,-25+bob,30,29,9);ctx.fill();ctx.fillStyle='#f0cc9e';ctx.fillRect(-11,-3+bob,8,8);ctx.fillRect(4,-3+bob,8,8);
 // Face turns toward the latest mouse target.
 const tilt=Math.max(-.34,Math.min(.34,Math.atan2(player.faceY,Math.max(.3,Math.abs(player.faceX)))*.24));ctx.save();ctx.translate(player.faceX*2,-42+bob+player.faceY*1.5);ctx.rotate(tilt);ctx.translate(-player.faceX*2,42-bob-player.faceY*1.5);
 // face
 ctx.fillStyle='#efc39b';ctx.beginPath();ctx.ellipse(-2,-42+bob,20,23,0,0,7);ctx.fill();
 // side parted hair and purple clip
 ctx.fillStyle='#49324d';ctx.beginPath();ctx.moveTo(-20,-43);ctx.quadraticCurveTo(-24,-68,1,-67);ctx.quadraticCurveTo(20,-65,18,-48);ctx.quadraticCurveTo(7,-56,-3,-56);ctx.quadraticCurveTo(-7,-47,-20,-43);ctx.fill();ctx.beginPath();ctx.moveTo(-4,-60);ctx.quadraticCurveTo(8,-64,22,-51);ctx.lineTo(15,-40);ctx.quadraticCurveTo(8,-51,-3,-52);ctx.fill();ctx.fillStyle='#b68ad3';ctx.beginPath();ctx.ellipse(10,-59,8,4,-.35,0,7);ctx.fill();ctx.fillStyle='#ecd6ff';ctx.fillRect(7,-61,5,2);
 // eyes, nostrils explicitly visible
 ctx.fillStyle='#342d42';ctx.beginPath();ctx.arc(-9+player.faceX*2,-42+bob+player.faceY,2.3,0,7);ctx.arc(4+player.faceX*2,-42+bob+player.faceY,2.3,0,7);ctx.fill();ctx.strokeStyle='#b66d6d';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(-1+player.faceX*2,-35+bob+player.faceY,4,.2,1.2);ctx.stroke();ctx.fillStyle='#6e4244';ctx.beginPath();ctx.arc(-3,-32+bob,1.25,0,7);ctx.arc(1,-32+bob,1.25,0,7);ctx.fill();ctx.restore();
 if(digging){const p=Math.max(0,Math.min(1,1-(digEndsAt-performance.now())/1050)),angle=p<.22 ? .08 : p<.4 ? 1.08 : p<.68 ? 1.08 : p<.78 ? -.12 : .12;ctx.strokeStyle='#efc39b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(10,-16);ctx.lineTo(18,-6);ctx.stroke();ctx.save();ctx.translate(19,-4);ctx.rotate(angle);ctx.strokeStyle='#75502c';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(0,29);ctx.stroke();ctx.fillStyle='#bbc7ce';ctx.beginPath();ctx.moveTo(-7,28);ctx.quadraticCurveTo(0,39,7,28);ctx.lineTo(4,23);ctx.lineTo(-4,23);ctx.fill();ctx.restore();if(p>.70&&p<.84){ctx.fillStyle='#e7d09a99';ctx.beginPath();ctx.arc(25,16,6,0,7);ctx.arc(35,13,5,0,7);ctx.fill()}}
 ctx.restore()}
function drawPolice(){ctx.fillStyle='#293456';ctx.fillRect(730,132,190,54);ctx.fillStyle='#dce9f4';ctx.fillRect(740,142,56,27);ctx.fillRect(801,142,35,27);ctx.fillStyle='#d9524e';ctx.fillRect(845,137,25,7);ctx.fillStyle='#6698cf';ctx.fillRect(874,137,25,7);ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.fillText('POLICE',840,180);drawText('嗚嗚！',824,126,16,'#fff')}
function drawHUD(){ctx.fillStyle='#273c6d';ctx.fillRect(0,0,W,103);ctx.fillStyle='#f5d47a';ctx.fillRect(0,99,W,4);if(mode==='road'){drawText('第二關｜挖馬路拚連任',28,40,21,'#fff3c3');drawText('選委會  →  市政府',28,76,18,'#fff');return}drawText('第一關｜任期施政成果',28,40,20,'#fff3c3');const f=Math.max(0,timeLeft/60);ctx.fillStyle='#17254f';ctx.fillRect(295,17,635,23);ctx.fillStyle=f>.35?'#f4d35e':'#de6654';ctx.fillRect(299,21,627*f,15);drawText(`任期 ${Math.ceil(timeLeft)} 秒`,930,56,17,'#fff','right');drawText(`米粉 ${counts.rice}`,28,79,14,'#fff');drawText(`寶特瓶 ${counts.bottle}`,140,79,14,'#fff');drawText(`棒球 ${counts.ball}`,270,79,14,'#fff');drawText(`傳票 ${summons}/3`,380,79,14,'#ffe0a3');drawText(`施政成果 ${score} 分`,930,79,15,'#ffeb92','right')}
function dig(){if(mode!=='dig'||!overlay.classList.contains('hidden')||performance.now()<lockUntil||digging||pendingTreasure)return;digging=true;digEndsAt=performance.now()+1050;setStatus('人物停住，舉鏟、停頓、用力落鏟…')}
function finishDig(){if(mode!=='dig')return;dug++;player.step+=1;const pit={x:player.x+player.faceX*23,y:player.y+player.faceY*12+8};pits.push(pit);if(pits.length>60)pits.shift();let near=items.filter(i=>!i.found&&Math.hypot(i.x-player.x,i.y-player.y)<135).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y));let it=near[0];if(!it){const remaining=items.filter(i=>!i.found);if(remaining.length&&Math.random()<.25){it=remaining[Math.floor(Math.random()*remaining.length)];it.hint=true}else{setStatus('挖到一個坑洞，裡面沒有東西');return}}it.found=true;it.emerging=true;it.emergeX=pit.x;it.emergeY=pit.y;it.emergeStart=performance.now();pendingTreasure=it;setStatus(`挖出：${labels[it.type]}`)}
function resolve(type){switch(type){case'bottle':counts.bottle++;score-=30;setStatus('2026 寶特瓶：施政成果 −30');break;case'ball':counts.ball++;score+=100;setStatus('棒球：施政成果 +100');break;case'rice':counts.rice++;updateHUD();cardHtml('挖出一坨米粉','<p class="quote">衛生局局長說：「甲醛米粉事件，煮一煮就可以吃了。」</p><p>米粉計入任期成果，任期暫停中。</p>',[{label:'繼續任期',action:()=>{hideCard();last=performance.now()}}]);break;case'truck':counts.truck++;showTimed('宣傳車出土',4,'<p>宣傳車開始播放競選標語。倒數繼續，暫停開挖 4 秒。</p><p class="quote">「把男友干政滾出市政府」<br>「讓裙帶關係滾出市政府」</p>');break;case'poster':counts.poster++;showTimed('挖出莊 OO 文宣',3.5,'<p>倒數繼續，暫停開挖 3.5 秒。</p><img class="orange-board" src="assets/zhuang-poster-reference.jpg" alt="莊 OO 橘底競選文宣">');break;case'summons':counts.summons++;summons++;police=true;if(summons>=3){mode='failed';summary('挑戰失敗','第三次挖到傳票，任期提前結束。')}else{cardHtml('警車來了！','<p>警方準備逮捕主角。先開記者會澄清，才能復活繼續挖掘。</p><p class="quote">「我今天從小到大，北一女、台大不說，我們師大也是榜首進去，台大是斐陶斐，學術成績第一名畢業，我今天有大秘寶就是要開挖」</p>',[{label:'召開記者會並復活',action:()=>{hideCard();police=false;last=performance.now();setStatus(`記者會後復活（第 ${summons} 次傳票）`)}}],'遊戲諷刺台詞');}}
updateHUD()}
function showTimed(title,sec,body){timedModal=true;lockUntil=performance.now()+sec*1000;cardHtml(title,body,[{label:`知道了（${sec} 秒）`,action:()=>{}}]);const b=card.querySelector('button');b.disabled=true;b.style.opacity='.75';let timer=setInterval(()=>{if(mode!=='dig'){clearInterval(timer);timedModal=false;return}let n=Math.ceil((lockUntil-performance.now())/1000);if(n<=0){clearInterval(timer);timedModal=false;hideCard();setStatus('可以繼續開挖');last=performance.now()}else b.textContent=`倒數中… ${n} 秒`},100)}
function summary(title,extra=''){let body=`<p>${extra}</p><p>任期施政成果：<b>${score} 分</b></p><p>米粉 ${counts.rice} 坨｜2026 寶特瓶 ${counts.bottle} 瓶｜棒球場成果 ${counts.ball} 顆</p><p>宣傳車 ${counts.truck} 台｜文宣 ${counts.poster} 張｜傳票 ${counts.summons} 張</p>`;cardHtml(title,body,[{label:'重新挑戰',action:start}], '政治諷刺遊戲；對白為虛構遊戲文本。')}
function tick(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(mode==='dig'&&(overlay.classList.contains('hidden')||timedModal)&&t>=lockUntil)timeLeft-=dt;
 if(mode==='dig'&&digging&&t>=digEndsAt){digging=false;finishDig()}
 if(mode==='dig'&&pendingTreasure&&t-pendingTreasure.emergeStart>=1050){const found=pendingTreasure;found.emerging=false;pendingTreasure=null;resolve(found.type)}
 if(mode==='dig'&&timeLeft<=0&&!digging&&!pendingTreasure&&!timedModal&&overlay.classList.contains('hidden')){timeLeft=0;mode='results';autoDig=false;summary('任期結束！',`成功撐過 60 秒，傳票 ${summons}/3。`)}
 if((mode==='dig'||mode==='intro'||mode==='results'||mode==='failed')&&!digging){let dx=player.tx-player.x,dy=player.ty-player.y,d=Math.hypot(dx,dy);if(d>2){player.aimX=dx/d;player.aimY=dy/d;let v=Math.min(d,150*dt);player.x+=dx/d*v;player.y+=dy/d*v;player.step+=dt*8}}
 const fx=player.faceX+(player.aimX-player.faceX)*Math.min(1,dt*10),fy=player.faceY+(player.aimY-player.faceY)*Math.min(1,dt*10),flen=Math.hypot(fx,fy)||1;player.faceX=fx/flen;player.faceY=fy/flen;
 if(mode==='dig'&&autoDig&&!digging&&Math.hypot(player.tx-player.x,player.ty-player.y)<=2){autoDig=false;dig()}
 if(mode==='road')drawRoad();else drawWorld();requestAnimationFrame(tick)}
function startRoad(){mode='road';gridPos=0;trail=[];const route=[[0,3],[1,3],[2,3],[2,2],[3,2],[4,2],[4,3],[5,3],[6,3],[6,4],[7,4],[8,4],[8,3],[9,3],[10,3],[11,3]];roadSet=new Set(route.map(p=>`${p[0]},${p[1]}`));trail=route;setStatus('拚連任中');cardHtml('第二關｜民怨四起，強勢領表拚連任','<p>從選委會出發，沿著被雜草遮住的馬路挖到市政府。</p><p>只能挖目前位置上下左右相鄰的格子。挖到雜草會觸發市政二選一；答對回到正確道路，答錯連任失敗。</p>',[{label:'從選委會出發',action:hideCard}])}
const qs=[['星際共融公園','公園開幕，市民遊玩','示意圖再開箱，市民再欣賞'],['消防廳舍改造','消防廳舍大改造','示意圖大改造，隔幾個月再開箱'],['國際會展暨表演中心','國際級會展中心，迎接國際活動','國際級 3D 動畫，搶先環遊未來'],['武陵市民活動中心','市民有活動中心可以使用','市民有活動中心示意圖可以欣賞'],['赤土崎樂活館','樂活生活，實際享受','樂活想像，線上享受'],['光華兒少家庭福利館','兒少家庭福利有實際空間','兒少家庭先享有視覺福利'],['新竹市立新竹幼兒園','小朋友有新幼兒園可以上學','小朋友先認識新幼兒園的示意圖'],['關埔國小','孩子走進新校園','家長走進市長的設計圖'],['星際探索主題共融公園','探索宇宙，體驗共融遊戲','探索市政，尋找公園在哪裡'],['消防廳舍大改造','消防設備升級，救災更有效率','示意圖升級，宣傳更有效率'],['虎林運動園區','到運動園區運動','對著運動園區示意圖運動'],['新竹市科教館','科學教育向下扎根','示意圖教育向下扎根'],['關埔空橋','空橋縫合，交通真正縫合','時間縫合，承諾再等一等'],['關東公共托嬰中心','爸媽安心送托，小孩安心成長','爸媽安心看圖，小孩繼續等托育']];
function drawRoad(){ctx.fillStyle='#7aa858';ctx.fillRect(0,0,W,H);for(let i=0;i<170;i++){let x=(i*137)%W,y=(i*83)%H;ctx.fillStyle=i%4?'#386943':'#d4ca6a';ctx.beginPath();ctx.ellipse(x,y,5,11,(i%8)/8,0,7);ctx.fill()}drawHUD();const cols=12,rows=7,cw=66,ch=66,ox=84,oy=170;
 // grass covers roads except traversed cells; irregular thick road surface underneath
 ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=colors.roadEdge;ctx.lineWidth=62;ctx.beginPath();trail.forEach(([c,r],i)=>i?ctx.lineTo(ox+c*cw+cw/2,oy+r*ch+ch/2):ctx.moveTo(ox+c*cw+cw/2,oy+r*ch+ch/2));ctx.stroke();ctx.strokeStyle=colors.road;ctx.lineWidth=50;ctx.stroke();
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let x=ox+c*cw,y=oy+r*ch,key=`${c},${r}`,isStart=c===0&&r===3,isEnd=c===11&&r===3,passed=trail.slice(0,gridPos+1).some(p=>p[0]===c&&p[1]===r);if(!passed&&!isStart&&!isEnd){ctx.fillStyle='#71994e';ctx.fillRect(x+2,y+2,cw-4,ch-4);ctx.fillStyle='#93b65e';ctx.beginPath();ctx.ellipse(x+14,y+18,8,17,-.4,0,7);ctx.ellipse(x+44,y+46,7,15,.3,0,7);ctx.fill();ctx.strokeStyle='#aec777';ctx.lineWidth=2;ctx.strokeRect(x+4,y+4,cw-8,ch-8)}else{ctx.strokeStyle='#92704c';ctx.lineWidth=2;ctx.strokeRect(x+4,y+4,cw-8,ch-8)}if(isStart){drawText('選委會',x+cw/2,y+ch/2+6,15,'#fff','center')}if(isEnd){drawText('市政府',x+cw/2,y+ch/2+6,15,'#fff','center')}if(passed&&!isStart&&!isEnd){drawText('➤',x+cw/2,y+ch/2+8,23,'#ffe477','center')}
 if(Math.abs(c-(gridPos<0?0:trail[gridPos]?.[0]||0))+Math.abs(r-(trail[gridPos]?.[1]||3))===1&&!overlay.classList.contains('hidden')){}else if(Math.abs(c-(trail[gridPos]?.[0]||0))+Math.abs(r-(trail[gridPos]?.[1]||3))===1){ctx.strokeStyle='#ffe579';ctx.lineWidth=3;ctx.strokeRect(x+9,y+9,cw-18,ch-18)}}
 drawText('點選相鄰格子，找到被雜草蓋住的路',480,660,17,'#fff','center')}
function cellFromEvent(e){const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width,y=(e.clientY-rect.top)*H/rect.height;return{x,y}}
canvas.addEventListener('click',e=>{if(!overlay.classList.contains('hidden'))return;const p=cellFromEvent(e);if(mode==='dig'){if(p.y<105)return;player.tx=Math.max(28,Math.min(930,p.x));player.ty=Math.max(150,Math.min(680,p.y));autoDig=true;setStatus('角色前往指定地點…');return}if(mode==='road'){const c=Math.floor((p.x-84)/66),r=Math.floor((p.y-170)/66);if(c<0||r<0||c>=12||r>=7)return;const current=trail[gridPos],adj=Math.abs(c-current[0])+Math.abs(r-current[1]);if(adj!==1){setStatus('只能挖相鄰的格子');return}if(c===11&&r===3){askFinalQuestion();return}if(roadSet.has(`${c},${r}`)){gridPos++;setStatus('挖到馬路，繼續前進');return}askQuestion()}});
function askQuestion(){let q=qs[Math.floor(Math.random()*qs.length)];question=q;cardHtml('市政考驗｜二選一',`<p><b>${q[0]}</b></p>`,[{label:`A. ${q[1]}`,action:()=>answer(true)},{label:`B. ${q[2]}`,action:()=>answer(false)}],'答對會回到正確道路上；答錯連任失敗。')}
function answer(ok){if(ok){hideCard();setStatus('答對了！回到正確道路');}else{mode='failed';summaryRoad(false)}}
function askFinalQuestion(){cardHtml('市政考驗｜最後一題','<p><b>請問市長最擅長的市政建設是哪一項？</b></p>',[{label:'A. 社福建設',action:()=>answerFinal(false)},{label:'B. 交通治理',action:()=>answerFinal(false)},{label:'C. 示意圖建設',action:()=>answerFinal(true)}],'答對才能抵達市政府。')}
function answerFinal(ok){if(ok){summaryRoad(true)}else{mode='failed';summaryRoad(false)}}
function summaryRoad(win){const extra=win?'<p>成功挖到市政府，連任成功，繼續擺拍四年！</p>':`<p>答錯市政二選一：${question?.[0]||''}。民怨四起，連任失敗。</p>`;cardHtml(win?'連任成功！':'連任失敗',`${extra}<hr><p>第一關施政成果：${score} 分</p><p>米粉 ${counts.rice} 坨｜2026 寶特瓶 ${counts.bottle} 瓶｜棒球場成果 ${counts.ball} 顆</p><p>傳票 ${counts.summons} 張</p>`,[{label:'再玩一次',action:start}], '政治諷刺遊戲；台詞與情節為虛構遊戲文本。')}
testBtn.onclick=()=>{if(mode==='intro'){mode='dig';hideCard();timeLeft=60;last=performance.now()}if(mode!=='dig'||digging||pendingTreasure)return;const type=testSelect.value;let it=items.find(i=>i.type===type&&!i.found);if(!it){it={type,found:false};items.push(it)}it.found=true;it.emerging=true;it.emergeX=player.x+player.faceX*24;it.emergeY=player.y+player.faceY*12+8;it.emergeStart=performance.now();pendingTreasure=it;setStatus(`測試出土：${labels[type]}`)};digBtn.onclick=dig;canvas.addEventListener('contextmenu',e=>{e.preventDefault();dig()});window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();dig()}if(mode==='dig'){let d=28;if(e.key==='ArrowLeft'||e.key==='a')player.tx-=d;if(e.key==='ArrowRight'||e.key==='d')player.tx+=d;if(e.key==='ArrowUp'||e.key==='w')player.ty-=d;if(e.key==='ArrowDown'||e.key==='s')player.ty+=d}});
// Allow the 60-second route challenge to transition from the results card.
const originalSummary=summary;summary=function(title,extra=''){if(title==='任期結束！'){let body=`<p>${extra}</p><p>任期施政成果：<b>${score} 分</b></p><p>米粉 ${counts.rice} 坨｜2026 寶特瓶 ${counts.bottle} 瓶｜棒球場成果 ${counts.ball} 顆</p><p>宣傳車 ${counts.truck} 台｜文宣 ${counts.poster} 張｜傳票 ${counts.summons} 張</p>`;cardHtml(title,body,[{label:'進入下一關｜拚連任',action:startRoad},{label:'重新挑戰',action:start}],'政治諷刺遊戲；對白為虛構遊戲文本。')}else originalSummary(title,extra)};
start();requestAnimationFrame(tick);
})();
</script></body></html>

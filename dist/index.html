<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a9d9e9">
<title>企鵝挖寶</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#dce8e9;color:#304850;font-family:Arial,"Noto Sans TC",sans-serif;display:grid;place-items:center;padding:16px}.page{width:min(100%,960px)}.screen{position:relative;width:100%;overflow:hidden;background:#8fc4d0;border:5px solid #829b9e;box-shadow:0 10px 28px #213e452e,inset 0 0 0 2px #e9f7f7}.game{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:#16344245}.overlay[hidden]{display:none}.dialog{width:min(370px,94%);padding:21px 24px 18px;text-align:center;background:linear-gradient(145deg,#e9f7ff,#b8deec);border:3px ridge #83b7cb;box-shadow:0 8px 22px #14374b58;color:#253f4e}.dialog .big{font-size:40px}.dialog h2{margin:4px 0 7px;font-size:23px;text-shadow:0 1px #fff}.dialog p{margin:0 0 15px;font-size:14px;line-height:1.7;color:#526e79}.btn{border:2px outset #e6d18d;padding:10px 20px;background:linear-gradient(#ffe99c,#eab947);color:#543f1e;font-weight:900;font-size:15px;cursor:pointer}.btn:active{border-style:inset}.help{padding:8px 3px;color:#5d747a;font-size:12px;display:flex;justify-content:space-between;gap:10px}.touch{display:none;justify-content:center;gap:7px;margin:7px 0}.touch button{width:46px;height:42px;border:2px outset #e6f3f4;background:#cbe4e8;color:#405e68;font-size:18px;touch-action:none}.touch .dig{width:auto;padding:0 14px;background:#f6df91;font-size:13px;font-weight:bold}.caption{text-align:center;color:#687e83;font-size:11px;margin:5px 0 0}@media(max-width:650px){body{padding:8px}.screen{border-width:3px}.touch{display:flex}.help{font-size:10px}.caption{font-size:10px}}
</style>
</head>
<body>
<main class="page">
  <section class="screen"><canvas id="game" class="game" width="960" height="720" aria-label="企鵝挖寶冰洞場景"></canvas>
    <div id="overlay" class="overlay"><div class="dialog"><div id="dialogEmoji" class="big">🐧</div><h2 id="dialogTitle">企鵝挖寶</h2><p id="dialogText">冰湖裡藏著寶石和炸彈。<br>看清楚位置，然後操控企鵝在冰面上尋寶！</p><button id="start" class="btn">開始探險</button></div></div>
  </section>
  <div class="help"><span>方向鍵／WASD 移動　・　空白鍵挖掘</span><span>💎20　🔴12　🔵8　🪙5</span></div>
  <div class="touch"><button data-dir="up" aria-label="向上">↑</button><button data-dir="left" aria-label="向左">←</button><button data-dir="down" aria-label="向下">↓</button><button data-dir="right" aria-label="向右">→</button><button class="dig" id="touchDig">挖掘 ⛏</button></div>
  <p class="caption">記住寶物位置　｜　移動到冰面上挖掘　｜　挖到炸彈就會結束</p>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
const W=960,H=720,field={x:74,y:54,w:812,h:485},HUD_Y=564;
const TYPES=['diamond','diamond','ruby','ruby','ruby','sapphire','sapphire','sapphire','sapphire','sapphire','sapphire','coin','coin','coin','coin','coin','coin','coin','bomb','bomb','bomb','bomb'];
const LABELS={diamond:'鑽石',ruby:'紅寶石',sapphire:'藍寶石',coin:'金幣',bomb:'炸彈'},POINTS={diamond:20,ruby:12,sapphire:8,coin:5,bomb:0};
let things=[],holes=[],penguin={x:478,y:397,face:1,step:0},keys={},target=null,phase='ready',score=0,time=35,clock=null,toast='',toastUntil=0,counts={diamond:0,ruby:0,sapphire:0,coin:0};
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),rand=(a,b)=>a+Math.random()*(b-a);
function placeThings(){things=[];const bag=TYPES.slice();for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}for(const type of bag){let p,tries=0;do{p={x:rand(field.x+24,field.x+field.w-24),y:rand(field.y+28,field.y+field.h-24)};tries++}while((distance(p,penguin)<72||things.some(t=>distance(t,p)<42))&&tries<100);things.push({...p,type,found:false})}}
function reset(){clearInterval(clock);phase='ready';score=0;time=35;penguin={x:478,y:397,face:1,step:0};holes=[];target=null;counts={diamond:0,ruby:0,sapphire:0,coin:0};placeThings();draw();showDialog('🐧','企鵝挖寶','記住冰面下寶物的位置，接著操控企鵝四處挖掘。<br>小心炸彈！','開始探險',begin)}
function showDialog(emoji,title,text,button,action){document.getElementById('dialogEmoji').textContent=emoji;document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogText').innerHTML=text;const b=document.getElementById('start');b.textContent=button;b.onclick=action;overlay.hidden=false}
function begin(){phase='memory';overlay.hidden=true;let n=3;toast='記住寶物的位置！';toastUntil=performance.now()+900;draw();const ticker=setInterval(()=>{n--;toast=n>0?`記住位置！ ${n}`:'開始挖寶！';toastUntil=performance.now()+1000;if(n<=0){clearInterval(ticker);phase='playing';clock=setInterval(()=>{if(phase!=='playing')return;time--;if(time<=0)finish('⌛','時間到！',`這次挖到 <b>${score} 分</b>。<br>再試一次，找出更多寶藏吧！`);draw()},1000)}draw()},1000)}
function finish(emoji,title,text){clearInterval(clock);phase='ended';target=null;showDialog(emoji,title,text,'再玩一次',reset);draw()}
function pathIce(){ctx.beginPath();ctx.moveTo(116,44);ctx.lineTo(835,42);ctx.lineTo(884,92);ctx.lineTo(866,151);ctx.lineTo(894,208);ctx.lineTo(865,284);ctx.lineTo(887,355);ctx.lineTo(842,430);ctx.lineTo(861,505);ctx.lineTo(800,548);ctx.lineTo(146,549);ctx.lineTo(84,515);ctx.lineTo(105,452);ctx.lineTo(67,390);ctx.lineTo(94,320);ctx.lineTo(68,253);ctx.lineTo(101,184);ctx.lineTo(78,112);ctx.closePath()}
function drawCave(){ctx.fillStyle='#7eabb7';ctx.fillRect(0,0,W,HUD_Y);const wall=ctx.createLinearGradient(0,0,0,HUD_Y);wall.addColorStop(0,'#c8e8ed');wall.addColorStop(.35,'#8cbcc6');wall.addColorStop(1,'#547d89');ctx.fillStyle=wall;ctx.fillRect(0,0,W,HUD_Y);
  // Translucent faceted ice walls, framed around one open cavern floor.
  for(let i=0;i<12;i++){const side=i%2===0;const x=side?((i*71)%145):815+((i*53)%145),y=20+((i*83)%520);const w=35+(i*17%70),h=58+(i*31%105);ctx.globalAlpha=.42+(i%3)*.08;ctx.fillStyle=i%2?'#eaf8f4':'#a6d1d9';ctx.beginPath();if(side){ctx.moveTo(0,y);ctx.lineTo(w,y-30);ctx.lineTo(w+20,y+h*.48);ctx.lineTo(w-10,y+h);ctx.lineTo(0,y+h+18)}else{ctx.moveTo(W,y);ctx.lineTo(W-w,y-30);ctx.lineTo(W-w-20,y+h*.48);ctx.lineTo(W-w+10,y+h);ctx.lineTo(W,y+h+18)}ctx.closePath();ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#e4f5f5';ctx.lineWidth=2;ctx.stroke()}
  pathIce();const g=ctx.createLinearGradient(120,48,820,548);g.addColorStop(0,'#a9d7e1');g.addColorStop(.45,'#8abfce');g.addColorStop(1,'#76aebe');ctx.fillStyle=g;ctx.fill();ctx.save();pathIce();ctx.clip();
  // Soft blue glacial shadows, ice grain, and angled cracks give the open floor the original 3D cavern look.
  for(let i=0;i<26;i++){const x=82+(i*149+31)%800,y=57+(i*97+43)%480;ctx.globalAlpha=.10;ctx.fillStyle=i%2?'#eefbfa':'#3e8093';ctx.beginPath();ctx.ellipse(x,y,42+(i*19%70),12+(i*11%32),((i*13%100)/100-.5),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
  for(let i=0;i<180;i++){const x=80+(i*79+13)%810,y=55+(i*131+29)%485;ctx.globalAlpha=.15+(i%4)*.05;ctx.fillStyle=i%3?'#effcff':'#4c8795';ctx.beginPath();ctx.ellipse(x,y,1+(i%3),1+(i%2),0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
  for(let i=0;i<17;i++){const x=98+(i*131)%775,y=75+(i*83)%445;ctx.strokeStyle=i%2?'#c8e9ed':'#6096a4';ctx.globalAlpha=.30;ctx.lineWidth=1+(i%2);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+19,y+4);ctx.lineTo(x+31,y-3);ctx.lineTo(x+52,y+12);ctx.lineTo(x+66,y+9);ctx.stroke()}ctx.globalAlpha=1;ctx.restore();
  // Shoreline shadows and chunky ice floes.
  ctx.strokeStyle='#dff2ef';ctx.globalAlpha=.75;ctx.lineWidth=11;pathIce();ctx.stroke();ctx.globalAlpha=1;
  for(let i=0;i<13;i++){const side=i%2===0,x=side?35+(i*63%65):862+(i*47%62),y=30+(i*101%510);ctx.fillStyle=i%3?'#d8eef0':'#a6cbd2';ctx.beginPath();ctx.moveTo(x-18,y+24);ctx.lineTo(x-8,y-13);ctx.lineTo(x+14,y-27);ctx.lineTo(x+38,y-8);ctx.lineTo(x+31,y+18);ctx.lineTo(x+11,y+34);ctx.closePath();ctx.fill();ctx.strokeStyle='#effbfa';ctx.lineWidth=2;ctx.stroke()}
  drawIgloo();}
function drawIgloo(){const x=498,y=235;ctx.fillStyle='#4e8391';ctx.globalAlpha=.35;ctx.beginPath();ctx.ellipse(x+5,y+52,63,17,-.08,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  const dome=ctx.createRadialGradient(x-22,y-12,5,x+4,y+13,78);dome.addColorStop(0,'#f4ffff');dome.addColorStop(.56,'#c5e3e9');dome.addColorStop(1,'#739ba7');ctx.fillStyle=dome;ctx.beginPath();ctx.ellipse(x,y+20,57,43,0,Math.PI,Math.PI*2);ctx.lineTo(x+57,y+20);ctx.ellipse(x,y+20,57,43,0,0,Math.PI);ctx.closePath();ctx.fill();ctx.strokeStyle='#7199a4';ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.beginPath();ctx.ellipse(x,y+21,57,43,0,Math.PI,Math.PI*2);ctx.clip();for(let row=0;row<5;row++){const yy=y-15+row*13,span=30+row*8;ctx.beginPath();ctx.moveTo(x-span,yy);ctx.lineTo(x+span,yy);ctx.strokeStyle=row%2?'#8eb7c1':'#d9eff1';ctx.lineWidth=3;ctx.stroke();for(let c=-3;c<=3;c++){const xx=x+c*16+(row%2?7:0);ctx.beginPath();ctx.moveTo(xx,yy-5);ctx.lineTo(xx,yy+6);ctx.strokeStyle='#91b8c1';ctx.lineWidth=1;ctx.stroke()}}ctx.restore();
  ctx.fillStyle='#355b68';ctx.beginPath();ctx.moveTo(x-16,y+49);ctx.lineTo(x-16,y+23);ctx.quadraticCurveTo(x,y+1,x+16,y+23);ctx.lineTo(x+16,y+49);ctx.closePath();ctx.fill();ctx.strokeStyle='#dff2f2';ctx.lineWidth=3;ctx.stroke()}
function gemIcon(type){return({diamond:'💎',ruby:'🔴',sapphire:'🔵',coin:'🟡',bomb:'💣'})[type]}
function drawTreasure(t){ctx.save();ctx.translate(t.x,t.y);ctx.shadowColor='#284b55aa';ctx.shadowBlur=8;ctx.fillStyle='#578a96';ctx.beginPath();ctx.ellipse(0,7,18,8,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.font='26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(gemIcon(t.type),0,-4);ctx.restore()}
function drawHole(h){ctx.save();ctx.translate(h.x,h.y);ctx.fillStyle='#5f98a4';ctx.beginPath();ctx.ellipse(0,1,22,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#254c5c';ctx.beginPath();ctx.ellipse(0,-2,15,8,0,0,Math.PI*2);ctx.fill();if(h.type){ctx.font='22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(h.type==='bomb'?'💥':gemIcon(h.type),0,-9)}ctx.restore()}
function gradient(a,b,c){const g=ctx.createLinearGradient(a,b,a+18,b+32);g.addColorStop(0,c[0]);g.addColorStop(.5,c[1]);g.addColorStop(1,c[2]);return g}
function drawPenguin(){const p=penguin,bob=phase==='playing'&&Object.values(keys).some(Boolean)?Math.sin(p.step*2)*2:0;ctx.save();ctx.translate(p.x,p.y+bob);ctx.scale(p.face,1);ctx.fillStyle='#315f6b66';ctx.beginPath();ctx.ellipse(1,25,28,10,0,0,Math.PI*2);ctx.fill();
  // Rounded shaded model with a pale belly, bright scarf, and little flippers.
  ctx.fillStyle=gradient(-15,-28,['#536b80','#243c56','#152a42']);ctx.beginPath();ctx.ellipse(0,0,21,34,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#172d43';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=gradient(-7,-3,['#ffffff','#f2f5eb','#c9d6d0']);ctx.beginPath();ctx.ellipse(4,8,14,22,-.1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=gradient(-8,-47,['#728398','#334d67','#1a3049']);ctx.beginPath();ctx.arc(1,-26,17,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1b3044';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(7,-29,4.4,5.5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1c2e3b';ctx.beginPath();ctx.arc(8,-29,2.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f7b849';ctx.beginPath();ctx.moveTo(13,-24);ctx.lineTo(27,-19);ctx.lineTo(13,-15);ctx.closePath();ctx.fill();ctx.strokeStyle='#d18d35';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle=gradient(-10,-4,['#a892d0','#6b5aa6','#473e7b']);ctx.beginPath();ctx.moveTo(-14,-8);ctx.quadraticCurveTo(0,-2,15,-10);ctx.lineTo(14,-2);ctx.quadraticCurveTo(0,6,-14,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#263e54';ctx.beginPath();ctx.ellipse(-18,1,6,16,.35,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(18,1,6,16,-.35,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f5ae3c';ctx.beginPath();ctx.ellipse(-6,31,8,4,0,0,Math.PI*2);ctx.ellipse(9,31,8,4,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawSevenDigit(x,y,digit,w=19,h=30){const seg={a:[x+4,y,x+w-4,y],g:[x+4,y+h/2,x+w-4,y+h/2],d:[x+4,y+h,x+w-4,y+h],f:[x,y+4,x,y+h/2-2],b:[x+w,y+4,x+w,y+h/2-2],e:[x,y+h/2+2,x,y+h-4],c:[x+w,y+h/2+2,x+w,y+h-4]};const on={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgecd',7:'abc',8:'abcdefg',9:'abfgcd'}[digit]||'';for(const [k,[x1,y1,x2,y2]]of Object.entries(seg)){ctx.lineCap='round';ctx.lineWidth=4;ctx.strokeStyle=on.includes(k)?'#25313c':'#b9d1d7';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}}
function digitBox(x,y,digits,w=23,h=34){const total=digits.length*w+(digits.length-1)*4;ctx.fillStyle='#f2f6f2';ctx.fillRect(x-5,y-5,total+10,h+10);ctx.strokeStyle='#718c92';ctx.lineWidth=2;ctx.strokeRect(x-5,y-5,total+10,h+10);for(let i=0;i<digits.length;i++)drawSevenDigit(x+i*(w+4),y,digits[i],w,h)}
function drawHud(){const bg=ctx.createLinearGradient(0,HUD_Y,0,H);bg.addColorStop(0,'#9fe1f0');bg.addColorStop(.18,'#78c4dc');bg.addColorStop(1,'#4e9dbc');ctx.fillStyle=bg;ctx.fillRect(0,HUD_Y,W,H-HUD_Y);ctx.fillStyle='#d9f6fa';ctx.fillRect(0,HUD_Y,W,5);ctx.strokeStyle='#d9f4f7';ctx.globalAlpha=.3;for(let i=0;i<32;i++){ctx.beginPath();ctx.moveTo(i*37,HUD_Y+8);ctx.lineTo(i*37+42,H);ctx.stroke()}ctx.globalAlpha=1;
  // Time at left; gem totals and score laid out like the original bottom status strip.
  ctx.fillStyle='#e8f4f0';ctx.beginPath();ctx.arc(37,613,17,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#637c80';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.moveTo(37,613);ctx.lineTo(37,601);ctx.moveTo(37,613);ctx.lineTo(46,617);ctx.stroke();
  const mm=String(Math.floor(time/60)).padStart(2,'0'),ss=String(time%60).padStart(2,'0');digitBox(62,594,[...mm].map(Number),19,34);ctx.fillStyle='#20303b';ctx.beginPath();ctx.arc(111,604,2,0,Math.PI*2);ctx.arc(111,620,2,0,Math.PI*2);ctx.fill();digitBox(126,594,[...ss].map(Number),19,34);
  const items=[['diamond',176,2],['ruby',310,2],['sapphire',444,2],['coin',578,2]];for(const[type,x,digits]of items){ctx.font='31px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(gemIcon(type),x+26,588);digitBox(x,608,String(counts[type]).padStart(digits,'0').split('').map(Number),19,32)}
  ctx.font='19px Arial';ctx.textAlign='center';ctx.fillText('💠',742,589);digitBox(770,608,String(score).padStart(3,'0').split('').map(Number),20,32);ctx.textAlign='left';ctx.fillStyle='#f4fdff';ctx.font='bold 14px Arial';ctx.fillText(phase==='memory'?'記住寶物！':phase==='playing'?'快挖！':phase==='ended'?'探險結束':'企鵝挖寶',855,616);
}
function draw(){ctx.clearRect(0,0,W,H);drawCave();for(const h of holes)drawHole(h);if(phase==='memory')for(const t of things)if(!t.found)drawTreasure(t);if(target&&phase==='playing'){ctx.strokeStyle='#fff3ab';ctx.lineWidth=3;ctx.setLineDash([7,6]);ctx.beginPath();ctx.arc(target.x,target.y,16,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}drawPenguin();drawHud();if(toast&&performance.now()<toastUntil){ctx.fillStyle='#164459bb';ctx.fillRect(340,35,280,38);ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.textAlign='center';ctx.fillText(toast,480,60);ctx.textAlign='left'}}
function dig(){if(phase!=='playing')return;const near=things.filter(t=>!t.found&&distance(t,penguin)<33).sort((a,b)=>distance(a,penguin)-distance(b,penguin))[0];if(!near){holes.push({x:penguin.x,y:penguin.y,type:null});time=Math.max(0,time-1);toast='這裡沒有寶物';toastUntil=performance.now()+1000;if(time<=0)finish('⌛','時間到！',`這次挖到 <b>${score} 分</b>。`);draw();return}near.found=true;holes.push({x:near.x,y:near.y,type:near.type});if(near.type==='bomb'){draw();finish('💥','挖到炸彈！','冰面炸開了，這趟探險提前結束。<br>下次記得避開炸彈。');return}score+=POINTS[near.type];counts[near.type]++;toast=`挖到${LABELS[near.type]} +${POINTS[near.type]}`;toastUntil=performance.now()+1100;draw()}
function move(dx,dy,dt){if(phase!=='playing')return;const mag=Math.hypot(dx,dy)||1,speed=176*dt;penguin.x=Math.max(field.x,Math.min(field.x+field.w,penguin.x+dx/mag*speed));penguin.y=Math.max(field.y,Math.min(field.y+field.h,penguin.y+dy/mag*speed));if(dx)penguin.face=dx>0?1:-1;penguin.step+=dt*12}
let last=performance.now();function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;if(phase==='playing'){let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(target){const tx=target.x-penguin.x,ty=target.y-penguin.y;if(Math.hypot(tx,ty)<7)target=null;else{dx=tx;dy=ty}}if(dx||dy)move(dx,dy,dt)}draw();requestAnimationFrame(loop)}
const mapping={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};window.addEventListener('keydown',e=>{const dir=mapping[e.key];if(dir){keys[dir]=true;e.preventDefault()}if(e.code==='Space'){e.preventDefault();dig()}});window.addEventListener('keyup',e=>{const dir=mapping[e.key];if(dir)keys[dir]=false});window.addEventListener('blur',()=>keys={});document.querySelectorAll('.touch button[data-dir]').forEach(b=>{const dir=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[dir]=true;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>keys[dir]=false);b.addEventListener('pointercancel',()=>keys[dir]=false)});document.getElementById('touchDig').addEventListener('pointerdown',e=>{e.preventDefault();dig()});canvas.addEventListener('pointerdown',e=>{if(phase!=='playing')return;const r=canvas.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,py=(e.clientY-r.top)*H/r.height;if(py<40||py>HUD_Y)return;target={x:Math.max(field.x,Math.min(field.x+field.w,px)),y:Math.max(field.y,Math.min(field.y+field.h,py))}});document.getElementById('start').onclick=begin;reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
